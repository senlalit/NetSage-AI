services:
  netsage:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netsage-ai
    ports:
      - "8501:8501"
    environment:
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
      STREAMLIT_SERVER_PORT: "8501"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      NETSAGE_LOG_LEVEL: "${NETSAGE_LOG_LEVEL:-INFO}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "scripts/container_healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
