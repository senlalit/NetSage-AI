! =====================================================================
! NetSage AI - Cisco Packet Tracer Lab Configuration
! Device: Router 2 (R2) - Remote Branch / Server Gateway Router
! Compatible with: Cisco 1941, 2901, 2911, 4321 in Packet Tracer
! =====================================================================

enable
configure terminal
hostname R2

! Disable DNS lookup during lab troubleshooting
no ip domain-lookup

! WAN Link connected to R1
interface GigabitEthernet0/0
 ip address 10.0.0.2 255.255.255.252
 ip ospf hello-interval 10
 ip ospf dead-interval 40
 no shutdown
!

! Server Farm / Remote Subnet
interface GigabitEthernet0/1
 ip address 10.0.0.129 255.255.255.128
 no shutdown
!

! OSPF Routing Process
router ospf 1
 router-id 2.2.2.2
 network 10.0.0.0 0.0.0.3 area 0
 network 10.0.0.128 0.0.0.127 area 0
!

! Enable CDP
cdp run

end
write memory
