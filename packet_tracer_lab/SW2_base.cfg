! =====================================================================
! NetSage AI - Cisco Packet Tracer Lab Configuration
! Device: Switch 2 (SW2) - Server Access Switch
! Compatible with: Cisco Catalyst 2960 in Packet Tracer
! =====================================================================

enable
configure terminal
hostname SW2

! Disable DNS lookup
no ip domain-lookup

! Create VLANs
vlan 10
 name Sales
vlan 20
 name Engineering
vlan 30
 name Servers
vlan 40
 name Finance
vlan 99
 name Management
exit

! Trunk Port to Switch SW1
interface FastEthernet0/24
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,99
 no shutdown
!

! Access Port for Server1 (VLAN 30)
interface FastEthernet0/5
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 no shutdown
!

! SVI Management Interface
interface Vlan99
 ip address 192.168.99.3 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.99.1

! Enable CDP
cdp run

end
write memory
