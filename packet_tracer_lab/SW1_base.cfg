! =====================================================================
! NetSage AI - Cisco Packet Tracer Lab Configuration
! Device: Switch 1 (SW1) - Distribution / Access Switch
! Compatible with: Cisco Catalyst 2960 in Packet Tracer
! =====================================================================

enable
configure terminal
hostname SW1

! Disable DNS lookup
no ip domain-lookup

! Create VLANs
vlan 10
 name Sales
vlan 20
 name Engineering
vlan 30
 name Servers
vlan 40
 name Finance
vlan 99
 name Management
exit

! Trunk Port to Router R1 (Router-on-a-Stick)
interface GigabitEthernet0/1
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,99
 no shutdown
!

! Trunk Port to Switch SW2
interface FastEthernet0/24
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,99
 no shutdown
!

! Access Port for PC1 (VLAN 10)
interface FastEthernet0/1
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
!

! Access Port for PC2 (VLAN 20)
interface FastEthernet0/2
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 no shutdown
!

! Access Port for PC3 / Finance PC (VLAN 40)
interface FastEthernet0/10
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast
 no shutdown
!

! SVI Management Interface
interface Vlan99
 ip address 192.168.99.2 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.99.1

! Enable CDP
cdp run

end
write memory
